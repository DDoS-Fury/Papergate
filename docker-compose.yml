services:
  # Base configuration for all services
  x-base: &base
    profiles: ["internal-base"]
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: graphagate
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ./public:/app/public
      - ./src:/app/src

  # --- PROFILO TRAINING TGN ---
  train-tgn:
    <<: *base
    profiles: ["training-tgn"]
    container_name: graphagate-train-tgn
    command: ["graphagate.train_tgn"]

  # Verifica della correttezza streaming del TGN (richiede gli artifact in public/).
  verify-tgn:
    <<: *base
    profiles: ["verify-tgn"]
    container_name: graphagate-verify-tgn
    command: ["graphagate.verify_tgn"]

  # --- SERVIZIO DI INFERENZA (long-running, REST/JSON) ---
  # Carica gli artifact in public/ ed espone l'API HTTP (graphagate.serve_api).
  # Referenziabile come servizio nel compose della ZTA (vedi docs/orchestrator_integration.md).
  # NB: un solo container/processo — il modello è uno stato mutabile in RAM.
  serve-tgn:
    <<: *base
    profiles: ["serve-tgn"]
    container_name: graphagate-serve-tgn
    command: ["graphagate.serve_api"]
    ports:
      - "8888:8088"
    healthcheck:
      # L'immagine CUDA non ha curl: si usa la stdlib Python.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8088/health').status==200 else sys.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
