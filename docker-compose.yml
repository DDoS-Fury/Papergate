services:
  # Base configuration for all services
  x-base: &base
    profiles: ["internal-base"]
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: graphagate
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ./public:/app/public
      - ./src:/app/src

  # --- TGN TRAINING PROFILE ---
  train-tgn:
    <<: *base
    profiles: ["training-tgn"]
    container_name: graphagate-train-tgn
    command: ["graphagate.train_tgn"]

  # Streaming-correctness verification of the TGN (requires the artifacts in public/).
  verify-tgn:
    <<: *base
    profiles: ["verify-tgn"]
    container_name: graphagate-verify-tgn
    command: ["graphagate.verify_tgn"]

  # --- INFERENCE SERVICE (long-running, REST/JSON) ---
  # Loads the artifacts in public/ and exposes the HTTP API (graphagate.serve_api).
  # Referenceable as a service in the ZTA compose (see docs/orchestrator_integration.md).
  # NB: a single container/process — the model is a mutable in-RAM state.
  serve-tgn:
    <<: *base
    profiles: ["serve-tgn"]
    container_name: graphagate-serve-tgn
    command: ["graphagate.serve_api"]
    ports:
      - "8888:8088"
    healthcheck:
      # The CUDA image has no curl: the Python stdlib is used instead.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8088/health').status==200 else sys.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # --- COMPARISON BASELINES (batch, one-shot) ---
  # Simpler anomaly detectors, runnable in dedicated containers for a reproducible
  # comparison against the TGN (see tests/baselines/README.md). The scripts live in
  # tests/ (not copied into the image): it is mounted as a volume and the
  # `python -m` entrypoint is overridden with `python <path>`.

  # Vanilla 2-node TGN (User -> Resource): 2-node ablation of the ZTA decomposition.
  baseline-tgn-2node:
    <<: *base
    profiles: ["baseline-tgn-2node"]
    container_name: graphagate-baseline-tgn-2node
    volumes:
      - ./public:/app/public
      - ./src:/app/src
      - ./tests:/app/tests
    entrypoint: ["python"]
    command: ["/app/tests/baselines/tgn_2node/tgn_2node_baseline.py"]

  # Isolation Forest (sklearn): non-relational, per-event static features only.
  baseline-iforest:
    <<: *base
    profiles: ["baseline-iforest"]
    container_name: graphagate-baseline-iforest
    volumes:
      - ./public:/app/public
      - ./src:/app/src
      - ./tests:/app/tests
    entrypoint: ["python"]
    command: ["/app/tests/baselines/isolation_forest/isolation_forest_baseline.py"]

  # Non-temporal GNN (GraphSAGE): TGN ablation without temporal memory/neighbourhood.
  baseline-gnn:
    <<: *base
    profiles: ["baseline-gnn"]
    container_name: graphagate-baseline-gnn
    volumes:
      - ./public:/app/public
      - ./src:/app/src
      - ./tests:/app/tests
    entrypoint: ["python"]
    command: ["/app/tests/baselines/simple_gnn/simple_gnn_baseline.py"]

  # One-Class SVM (sklearn): non-relational, per-event static features only
  # (kernel counterpart of the Isolation Forest).
  baseline-ocsvm:
    <<: *base
    profiles: ["baseline-ocsvm"]
    container_name: graphagate-baseline-ocsvm
    volumes:
      - ./public:/app/public
      - ./src:/app/src
      - ./tests:/app/tests
    entrypoint: ["python"]
    command: ["/app/tests/baselines/ocsvm/ocsvm_baseline.py"]

  # XGBoost (sklearn): supervised ML approach.
  baseline-xgboost:
    <<: *base
    profiles: ["baseline-xgboost"]
    container_name: graphagate-baseline-xgboost
    volumes:
      - ./public:/app/public
      - ./src:/app/src
      - ./tests:/app/tests
    entrypoint: ["python"]
    command: ["/app/tests/baselines/xgboost/xgboost_baseline.py"]

  # External validity: evaluates the lateral-movement detector on the PUBLIC
  # LANL auth dataset (red-team labels), remapped as a ZTA stream. Download
  # auth.txt.gz and redteam.txt from https://csr.lanl.gov/data/cyber1/ and put them
  # in ./data (NOT versioned); it reuses the whole pipeline via train_tgn(dataset=...).
  # See tests/eval_lanl.py.
  eval-lanl:
    <<: *base
    profiles: ["eval-lanl"]
    container_name: graphagate-eval-lanl
    volumes:
      - ./public:/app/public
      - ./src:/app/src
      - ./tests:/app/tests
      - ./data:/data
    entrypoint: ["python"]
    command: ["/app/tests/eval_lanl.py",
              "--auth-path", "/data/auth.txt.gz",
              "--redteam-path", "/data/redteam.txt",
              "--max-events", "10000000",
              "--benign-stride", "10",
              "--epochs", "2",
              "--window-pad", "1209600",
              "--train-frac", "0.3",
              "--eval-batch-size", "1024"]

  # External validity on REAL telemetry with all 5 nodes populated (ssl.log carries
  # ja3): PicoDomain. Prerequisite: ./data contains Zeek_Logs.7z extracted into
  # ./data/logs plus "Red Log.xlsx". Dataset: https://github.com/iHeartGraph/PicoDomain
  eval-picodomain:
    <<: *base
    profiles: ["eval-picodomain"]
    container_name: graphagate-eval-picodomain
    volumes:
      - ./public:/app/public
      - ./src:/app/src
      - ./tests:/app/tests
      - ./data:/data
    entrypoint: ["python"]
    command: ["/app/tests/eval_picodomain.py",
              "--log-dir", "/data/logs",
              "--red-log", "/data/Red Log.xlsx",
              "--epochs", "15",
              "--eval-batch-size", "1024"]

  # Ablation study: full vs no-struct-head vs no-hashed-identity (save=False, does
  # not touch the artifacts in public/). The contribution of the temporal part is
  # instead isolated by the Static GNN baseline.
  ablations:
    <<: *base
    profiles: ["ablations"]
    container_name: graphagate-ablations
    volumes:
      - ./public:/app/public
      - ./src:/app/src
      - ./tests:/app/tests
    entrypoint: ["python"]
    command: ["/app/tests/ablations/run_ablations.py"]

  # Focused validation of the config node (v4): theft-rich stream (the incidents land
  # in the test split) + v4 vs config-node ablation comparison (~v3). save=False.
  config-eval:
    <<: *base
    profiles: ["config-eval"]
    container_name: graphagate-config-eval
    volumes:
      - ./public:/app/public
      - ./src:/app/src
      - ./tests:/app/tests
    entrypoint: ["python"]
    command: ["/app/tests/ablations/run_config_eval.py"]

  # Experiment: TPM-less devices collapsed onto a single dev:guest node (mirror of
  # conf:guest) vs per-cookie keying. Theft-rich stream + save=False (does not touch public/).
  guest-device-eval:
    <<: *base
    profiles: ["guest-device-eval"]
    container_name: graphagate-guest-device-eval
    volumes:
      - ./public:/app/public
      - ./src:/app/src
      - ./tests:/app/tests
    entrypoint: ["python"]
    command: ["/app/tests/ablations/run_guest_device_eval.py"]

  # Fills the report gap: evaluates the deployable (v4 + dev:guest) on the STANDARD
  # stream (Panel B protocol, 200k/15ep, routed decision) vs v4 per-cookie, at equal
  # data. The published standard numbers were per-cookie only. Standard stream + save=False.
  guest-standard-eval:
    <<: *base
    profiles: ["guest-standard-eval"]
    container_name: graphagate-guest-standard-eval
    volumes:
      - ./public:/app/public
      - ./src:/app/src
      - ./tests:/app/tests
    entrypoint: ["python"]
    command: ["/app/tests/ablations/run_guest_standard_eval.py"]

  # Architectural sweep (v4): extra MLP layers, memory_dim, attention heads.
  # save=False (does not touch public/); adoption only if it improves beyond multi-seed noise.
  arch-sweep:
    <<: *base
    profiles: ["arch-sweep"]
    container_name: graphagate-arch-sweep
    volumes:
      - ./public:/app/public
      - ./src:/app/src
      - ./tests:/app/tests
    entrypoint: ["python"]
    command: ["/app/tests/ablations/run_arch_sweep.py"]

  # Reproducible regeneration of the report's Panels A/B (tab:baselines, tab:v3v4),
  # multi-seed (save=False, does not touch public/). Writes the metric JSONs to
  # tasks/runs/ and the LaTeX fragments to docs/paper/generated/.
  #   docker compose --profile regen-report up
  regen-report:
    <<: *base
    profiles: ["regen-report"]
    container_name: graphagate-regen-report
    volumes:
      - ./public:/app/public
      - ./src:/app/src
      - ./tests:/app/tests
      - ./tasks:/app/tasks
      - ./docs:/app/docs
    entrypoint: ["python"]
    command: ["/app/tests/regen_report_tables.py"]

  # Ablation study to assess the model's effectiveness without the device edge.
  # Uses the test client to stream requests to serve-tgn omitting the key_device parameter.
  # Depends on serve-tgn, which must already be running (or started together via the two profiles).
  test-ablation:
    <<: *base
    profiles: ["ablation-no-device"]
    container_name: graphagate-test-ablation
    volumes:
      - ./public:/app/public
      - ./src:/app/src
      - ./tests:/app/tests
    entrypoint: ["python"]
    command: ["/app/tests/test_client.py", "--host", "serve-tgn", "--port", "8088", "--duration", "120", "--no-device"]
    depends_on:
      serve-tgn:
        condition: service_healthy
