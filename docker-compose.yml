services:
  # Base configuration for all services
  x-base: &base
    profiles: ["internal-base"]
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: graphagate
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ./public:/app/public
      - ./src:/app/src

  # --- PROFILO TRAINING TGN ---
  train-tgn:
    <<: *base
    profiles: ["training-tgn"]
    container_name: graphagate-train-tgn
    command: ["graphagate.train_tgn"]

  # Verifica della correttezza streaming del TGN (richiede gli artifact in public/).
  verify-tgn:
    <<: *base
    profiles: ["verify-tgn"]
    container_name: graphagate-verify-tgn
    command: ["graphagate.verify_tgn"]

  # --- SERVIZIO DI INFERENZA (long-running, REST/JSON) ---
  # Carica gli artifact in public/ ed espone l'API HTTP (graphagate.serve_api).
  # Referenziabile come servizio nel compose della ZTA (vedi docs/orchestrator_integration.md).
  # NB: un solo container/processo — il modello è uno stato mutabile in RAM.
  serve-tgn:
    <<: *base
    profiles: ["serve-tgn"]
    container_name: graphagate-serve-tgn
    command: ["graphagate.serve_api"]
    ports:
      - "8888:8088"
    healthcheck:
      # L'immagine CUDA non ha curl: si usa la stdlib Python.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8088/health').status==200 else sys.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # --- BASELINE DI CONFRONTO (batch, one-shot) ---
  # Detector di anomalie più semplici, eseguibili in container dedicati per un
  # confronto riproducibile col TGN (vedi tests/baselines/README.md). Gli script
  # vivono in tests/ (non copiata nell'immagine): la si monta come volume e si
  # sovrascrive l'entrypoint `python -m` con `python <path>`.

  # Isolation Forest (sklearn): non-relazionale, solo feature statiche per-evento.
  baseline-iforest:
    <<: *base
    profiles: ["baseline-iforest"]
    container_name: graphagate-baseline-iforest
    volumes:
      - ./public:/app/public
      - ./src:/app/src
      - ./tests:/app/tests
    entrypoint: ["python"]
    command: ["/app/tests/baselines/isolation_forest/isolation_forest_baseline.py"]

  # GNN non temporale (GraphSAGE): ablation del TGN senza memoria/vicinato temporale.
  baseline-gnn:
    <<: *base
    profiles: ["baseline-gnn"]
    container_name: graphagate-baseline-gnn
    volumes:
      - ./public:/app/public
      - ./src:/app/src
      - ./tests:/app/tests
    entrypoint: ["python"]
    command: ["/app/tests/baselines/simple_gnn/simple_gnn_baseline.py"]

  # One-Class SVM (sklearn): non-relazionale, solo feature statiche per-evento
  # (controparte kernel dell'Isolation Forest).
  baseline-ocsvm:
    <<: *base
    profiles: ["baseline-ocsvm"]
    container_name: graphagate-baseline-ocsvm
    volumes:
      - ./public:/app/public
      - ./src:/app/src
      - ./tests:/app/tests
    entrypoint: ["python"]
    command: ["/app/tests/baselines/ocsvm/ocsvm_baseline.py"]

  # Ablation study: full vs no-struct-head vs no-hashed-identity (save=False, non
  # tocca gli artifact in public/). Il contributo della parte temporale è invece
  # isolato dalla baseline Static GNN.
  ablations:
    <<: *base
    profiles: ["ablations"]
    container_name: graphagate-ablations
    volumes:
      - ./public:/app/public
      - ./src:/app/src
      - ./tests:/app/tests
    entrypoint: ["python"]
    command: ["/app/tests/ablations/run_ablations.py"]
