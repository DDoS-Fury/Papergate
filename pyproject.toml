[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphagate"
version = "0.1.0"
description = "Streaming Temporal Graph Network for unsupervised anomaly detection in Zero Trust Architectures"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { file = "LICENSE" }
dependencies = [
    "torch==2.12.*",
    "torch_geometric>=2.6,<3.0",
    "numpy>=1.26,<3.0",
    "scikit-learn>=1.4",
    # Statistical tests: KS in the leakage audit, Wilcoxon in the paired-delta reporting.
    "scipy>=1.11",
    # Supervised reference baseline (tests/baselines/xgboost) — packaged so the Panel A
    # comparison is reproducible out-of-the-box (no runtime pip install). Mirrors requirements.txt.
    "xgboost>=2.0.0",
    # Progress bars for training + offline streaming evaluation (TTY-aware, docker-log safe).
    "tqdm>=4.66",
    # HTTP inference service (graphagate.serve_api); pydantic ships with fastapi.
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29",
    "psutil>=5.9.0",
    "codecarbon",
    "aiohttp",
]

[project.optional-dependencies]
# The unit tests under tests/ are pytest-based (policy/BLP, netclass, serving v2,
# calibration, leakage audit). Install with:  uv pip install -e '.[dev]'
dev = ["pytest>=8.0"]

[tool.setuptools]
# `src/` layout: the package `graphagate` lives in src/.
package-dir = { "graphagate" = "src" }
packages = ["graphagate", "graphagate.data", "graphagate.model"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --ignore=tests/test_client.py"
filterwarnings = [
    "ignore::DeprecationWarning",
]
