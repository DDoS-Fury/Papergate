# Override per i test live SENZA sovrascrivere i pesi puliti.
# serve-tgn carica e (su shutdown, lifespan save_model) RISALVA nella COPIA ./.test_public,
# mai in ./public: così ripetere un test NON richiede di riaddestrare il modello.
# Aggiunge il servizio test-client standard (with-device), assente nel compose base.
#
# PREREQUISITO (una volta, e per ripartire da pesi puliti): copia gli artifact in ./.test_public
#   cp -r public .test_public
#
# Test standard (with-device):
#   docker compose -f docker-compose.yml -f docker-compose.test.yml --profile serve-tgn \
#       --profile test-client up --abort-on-container-exit --no-build
# Test no-device (ablation):
#   docker compose -f docker-compose.yml -f docker-compose.test.yml --profile serve-tgn \
#       --profile ablation-no-device up --abort-on-container-exit --no-build
services:
  serve-tgn:
    volumes:
      - ./.test_public:/app/public
      - ./src:/app/src

  # test client standard (stream completo source->device->user->dst)
  test-client:
    profiles: ["test-client"]
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: graphagate
    container_name: graphagate-test-client
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ./.test_public:/app/public
      - ./src:/app/src
      - ./tests:/app/tests
    entrypoint: ["python"]
    command: ["/app/tests/test_client.py", "--host", "serve-tgn", "--port", "8088", "--duration", "120"]
    depends_on:
      serve-tgn:
        condition: service_healthy
